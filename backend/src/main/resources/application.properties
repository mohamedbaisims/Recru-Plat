spring.application.name=backend

# Secrets locaux (non versionnés) : copier application-local.properties.example
# vers application-local.properties et renseigner les valeurs.
spring.config.import=optional:classpath:application-local.properties

# --- Database ---
spring.datasource.url=jdbc:mysql://localhost:3306/pfa
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
# --- JWT Security ---
spring.application.security.jwt.expiration=86400000
spring.application.security.jwt.refresh-token.expiration=604800000

# --- Email ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8
logging.level.org.springframework.mail=DEBUG
